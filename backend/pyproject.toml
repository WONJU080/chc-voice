[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chc-voice"
version = "0.1.0"
description = "macOS local Chinese speech relay: streaming ASR -> optional JA translation -> Fish TTS -> BlackHole virtual microphone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "sounddevice>=0.4.6",
  "websockets>=13",
  "httpx>=0.27",
  "ormsgpack>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
chc-voice = "chc_voice.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chc_voice = ["webui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
